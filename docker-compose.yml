services:

  # ── Strapi CMS ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "1339:1339"
      - "5173:5173"
    volumes:
      # source hot-reload
      - ./backend/src:/app/src
      - ./backend/config:/app/config
      # persist SQLite database and uploads
      - strapi_tmp:/app/.tmp
      - ./backend/public/uploads:/app/public/uploads
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1339/_health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Next.js frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "3002:3002"
    volumes:
      # source hot-reload (node_modules stay in the image)
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/messages:/app/messages
    environment:
      # Public URL — used in the browser (must be reachable from the user's machine)
      NEXT_PUBLIC_STRAPI_URL: http://localhost:1339
      # Internal URL — used by Next.js server components inside Docker network
      STRAPI_INTERNAL_URL: http://backend:1339
      # Shared secret for the Strapi publish webhook -> /api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-local-dev-revalidate-secret}
      # GA4 Measurement Protocol secret for server-side events (offer clicks). Unset locally means
      # events are skipped with a warning, never sent to the live property by accident.
      # GA_MP_DEBUG=1 routes hits to Google's validation endpoint instead. See docs/analytics-server-side.md
      GA_API_SECRET: ${GA_API_SECRET:-}
      GA_MP_DEBUG: ${GA_MP_DEBUG:-}
      # Live-cam affiliate feed credentials (server-only — affiliate codes, never NEXT_PUBLIC_).
      CHATURBATE_WM: ${CHATURBATE_WM:-y98oG}
      BONGACAMS_CAMPAIGN: ${BONGACAMS_CAMPAIGN:-}
      # ImLive hostlist API key (secret — no default; unset ⇒ ImLive disabled entirely).
      IMLIVE_API_KEY: ${IMLIVE_API_KEY:-}
      IMLIVE_WID: ${IMLIVE_WID:-126682575285}
      # ImLive SDK attribution (public — inlined into the client bundle).
      NEXT_PUBLIC_IMLIVE_SPONSOR_ID: ${NEXT_PUBLIC_IMLIVE_SPONSOR_ID:-10207425}
      NEXT_PUBLIC_IMLIVE_ORIGIN: ${NEXT_PUBLIC_IMLIVE_ORIGIN:-53175}
      STRIPCASH_API_KEY: ${STRIPCASH_API_KEY:-}
      STRIPCASH_USER_ID: ${STRIPCASH_USER_ID:-d049206f9ddd5694ad628f6e5ba9717a76851349ae4e3e0565f219188cb9b2a6}
      # Shared secret for the cam feed roster sync -> Strapi POST /api/cam-models/sync.
      # Must match CAM_SYNC_SECRET in backend/.env.
      CAM_SYNC_SECRET: ${CAM_SYNC_SECRET:-local-dev-cam-sync-secret}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  strapi_tmp:
