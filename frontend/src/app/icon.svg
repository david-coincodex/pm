<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PornMode">
  <!--
    Favicon. Mirrors the wordmark in NavMenu (dark "Porn" + emerald "Mode") reduced to a "PM"
    monogram, because at 16x16 a full wordmark is an unreadable smudge.

    Geometry is drawn as paths rather than <text>: an SVG favicon is rasterised by the browser with
    whatever font it happens to resolve, so <text> renders inconsistently (and not at all in some
    contexts). Paths look identical everywhere.
  -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>

  <!-- P — white. Stem plus a counter-punched bowl. -->
  <path fill="#ffffff" d="M12 16h14.4c6.3 0 10.4 3.9 10.4 9.7 0 5.9-4.1 9.8-10.4 9.8h-6.6V48H12V16Zm13.2 13.2c2.7 0 4.3-1.3 4.3-3.5 0-2.2-1.6-3.5-4.3-3.5h-5.4v7h5.4Z"/>

  <!-- M — emerald (Tailwind emerald-500), matching the wordmark's accent half. -->
  <path fill="#10b981" d="M38 48V16h6.6l4.6 11.6L53.8 16H60v32h-5.9V29.4l-3.6 8.8h-2.9l-3.7-8.8V48H38Z"/>
</svg>
