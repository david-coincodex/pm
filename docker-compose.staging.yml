services:
  frontend:
    image: ghcr.io/david-coincodex/pm-frontend:latest
    restart: unless-stopped
    # Next.js standalone server. Server components fetch the CMS over the internal
    # Docker network (STRAPI_INTERNAL_URL); the browser uses NEXT_PUBLIC_STRAPI_URL,
    # which is baked into the client bundle at BUILD time (see deploy-staging.yml
    # build-args) — the runtime value here only affects server-side reads.
    environment:
      NODE_ENV: production
      PORT: "3002"
      HOSTNAME: "0.0.0.0"
      STRAPI_INTERNAL_URL: http://backend:1339
      NEXT_PUBLIC_STRAPI_URL: https://cms-staging.pornmode.com
      # Shared secret for the Strapi publish webhook -> /api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      # GA4 Measurement Protocol secret for server-side offer-click events. Server-only on purpose
      # — as NEXT_PUBLIC_* it would ship to the browser and let anyone forge hits.
      GA_API_SECRET: ${GA_API_SECRET}
      # Live-cam affiliate feed credentials (server-only)
      CHATURBATE_WM: ${CHATURBATE_WM:-y98oG}
      BONGACAMS_CAMPAIGN: ${BONGACAMS_CAMPAIGN:-660500}
      # ImLive hostlist API key (secret — no default; unset ⇒ ImLive disabled entirely).
      IMLIVE_API_KEY: ${IMLIVE_API_KEY:-}
      IMLIVE_WID: ${IMLIVE_WID:-126682575285}
      STRIPCASH_API_KEY: ${STRIPCASH_API_KEY:-}
      STRIPCASH_USER_ID: ${STRIPCASH_USER_ID:-d049206f9ddd5694ad628f6e5ba9717a76851349ae4e3e0565f219188cb9b2a6}
      # Shared secret for the cam feed roster sync -> Strapi POST /api/cam-models/sync
      # (server-only; must match the backend's value)
      CAM_SYNC_SECRET: ${CAM_SYNC_SECRET}
      # Cloudflare Turnstile secret — the BFF verifies signup/reset captcha tokens with it.
      # Its public half (NEXT_PUBLIC_TURNSTILE_SITE_KEY) is a BUILD arg in the workflow, not a
      # runtime value: both empty ⇒ captcha off, only one set ⇒ the app refuses to serve those
      # routes rather than silently running without a captcha.
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    # No ports here — Traefik routes external traffic via labels below
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_public
      - traefik.http.routers.promode.rule=Host(`staging.pornmode.com`)
      - traefik.http.routers.promode.entrypoints=web
      - traefik.http.services.promode.loadbalancer.server.port=3002
    networks:
      - traefik_public
      - internal
    depends_on:
      - backend

  backend:
    image: ghcr.io/david-coincodex/pm-backend:latest
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "1339"
      NODE_ENV: production
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DATABASE_CLIENT: postgres
      # 'db' resolves to the postgres service inside the Docker network
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-promode}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSL: "false"
      # CORS origin for the public frontend (config/middlewares.ts reads FRONTEND_URL).
      # ALSO the host used in confirmation/reset links and as the Google redirect target —
      # the bootstrap seeds all three into the users-permissions store from this one value.
      FRONTEND_URL: https://staging.pornmode.com
      # Public origin of THIS CMS. Strapi builds the Google OAuth redirect_uri from it, so it
      # must match the URI registered in the Google console exactly.
      STRAPI_PUBLIC_URL: https://cms-staging.pornmode.com
      # Transactional email (confirmation, password reset, signup-attempt notice) via the
      # MAILGUN HTTP API — an adult-friendly sender, DKIM/SPF valid on pornmode.com itself, so
      # DKIM aligns strictly with the noreply@pornmode.com From address. The key is the whole
      # credential, which is why this is the API and not SMTP (that needs separate per-domain
      # credentials).
      #
      # The API is the ONLY mail path (no SMTP, by decision). Key empty ⇒ no mailer ⇒
      # registration degrades to immediate sign-in rather than creating unconfirmable accounts.
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-pornmode.com}
      # Marketing list that CONFIRMED accounts are added to (consent is the confirmation click).
      MAILGUN_LIST_ADDRESS: ${MAILGUN_LIST_ADDRESS:-newsletter@pornmode.com}
      # EU Mailgun accounts must use https://api.eu.mailgun.net — ours is US.
      MAILGUN_URL: ${MAILGUN_URL:-https://api.mailgun.net}
      # Same domain Mailgun signs, so DKIM aligns strictly under _dmarc.pornmode.com.
      EMAIL_FROM: ${EMAIL_FROM:-noreply@pornmode.com}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      # Replyable address on the "someone tried to sign up with your email" notice
      # (EMAIL_FROM is a no-reply mailbox, so it must not be used for that).
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-info@pornmode.com}
      # Google sign-in via the stock users-permissions provider. Set ⇒ seeded into the plugin
      # store every boot. Empty ⇒ the store is left alone, so it can be enabled in Settings →
      # Users & Permissions plugin → Providers and will survive restarts. The site asks the CMS
      # which providers are on, so there is no frontend flag to keep in step.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Shared secret guarding POST /api/cam-models/sync (the frontend posts the feed roster)
      CAM_SYNC_SECRET: ${CAM_SYNC_SECRET}
      # Healthchecks.io heartbeats (docs/monitoring.md). Empty => pings skipped, crons still run.
      HEALTHCHECKS_PING_KEY: ${HEALTHCHECKS_PING_KEY:-}
      # Names this environment's check slugs in the shared Healthchecks project.
      HEALTHCHECKS_SLUG_PREFIX: staging
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_public
      - traefik.http.routers.promode-cms.rule=Host(`cms-staging.pornmode.com`)
      - traefik.http.routers.promode-cms.entrypoints=web
      - traefik.http.services.promode-cms.loadbalancer.server.port=1339
      # Serve uploaded media from the FRONTEND host as well, so media is same-origin with
      # the site. cms-staging is a separate Cloudflare Access application from
      # staging.pornmode.com (separate cookies), so media loaded from the CMS host 302s to a
      # login page even for a signed-in reviewer — and at launch it would be unreachable for
      # visitors and Googlebot. Routing /uploads through the public host couples media
      # visibility to the site's own, so it becomes public automatically at launch.
      #
      # Explicit priority: without it Traefik orders by rule length, and the frontend's bare
      # Host(...) rule could win over this more specific one.
      - traefik.http.routers.promode-uploads.rule=Host(`staging.pornmode.com`) && PathPrefix(`/uploads`)
      - traefik.http.routers.promode-uploads.entrypoints=web
      - traefik.http.routers.promode-uploads.priority=100
      - traefik.http.routers.promode-uploads.service=promode-cms
    volumes:
      - strapi_public:/app/public
    networks:
      - traefik_public
      - internal

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-promode}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-promode}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  traefik_public:
    external: true
  internal:
    driver: bridge

volumes:
  postgres_data:
  strapi_public:
